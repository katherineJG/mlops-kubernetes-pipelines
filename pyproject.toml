[project]
name = "mlops-kubernetes-pipelines"
version = "0.1.0"
description = "Argo Workflows stages wrapping the Project 01 churn pipeline"
requires-python = ">=3.12,<3.13"
dependencies = ["churn-pipeline"]

[tool.uv.sources]
churn-pipeline = { path = "../Reproducible ML Training Pipeline" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_stages"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
