# Least privilege for workflow pods: the Argo executor only needs to report task results.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-workflow
  namespace: ml-workflows
automountServiceAccountToken: true  # the executor sidecar needs it to talk to the API
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-workflow-executor
  namespace: ml-workflows
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-workflow-executor
  namespace: ml-workflows
subjects:
  - kind: ServiceAccount
    name: ml-workflow
    namespace: ml-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ml-workflow-executor
---
# Argo's init/wait containers mount this token (executor.serviceAccountName in the workflow); the stage
# container gets none. The API server fills in the token. It does not expire, but it can only do what
# the Role above allows: create/patch workflowtaskresults in this namespace.
apiVersion: v1
kind: Secret
metadata:
  name: ml-workflow.service-account-token
  namespace: ml-workflows
  annotations:
    kubernetes.io/service-account.name: ml-workflow
type: kubernetes.io/service-account-token
