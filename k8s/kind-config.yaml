kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Single node on purpose: the artifact PVC is ReadWriteOnce (kind's default local-path storage).
# The default CNI (kindnet) does not enforce NetworkPolicy, so it is replaced by Calico after creation.
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
